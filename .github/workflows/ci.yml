# =============================================================================
#  CI：后端构建 + 单元测试 + 全量端到端验收
#
#  为什么是 ubuntu-latest 而不是 windows-latest：
#    1. 项目里的 .ps1 已经只依赖 PowerShell/.NET 的跨平台能力（System.Net.Http），
#       pwsh 在 Linux 上同样能跑，不绑定 Windows；
#    2. GitHub 的 Windows runner 不支持 service containers，起 MySQL 更麻烦；
#    3. ubuntu 镜像自带 MySQL 8，启动即可用。
#
#  注意（诚实记录）：
#    本工作流编写时项目还没有远程仓库，**从未在 Actions 上真实跑过一次**。
#    语法经过本地校验，但首次推送后仍可能需要微调（尤其是 MySQL 启动方式
#    与 runner 镜像版本相关）。若首次运行失败，先看 "Start MySQL" 与
#    "Wait for readiness" 两步。
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend-and-e2e:
    name: Build, unit tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # 与 application.yml 的默认值对齐，省去改配置
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: personal_ledger
      DB_USERNAME: root
      DB_PASSWORD: '123456'
      # 测试期间用 INFO 即可，避免 DEBUG 刷出几十 MB 日志
      APP_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start MySQL and create the database
        run: |
          sudo systemctl start mysql.service
          # 等 mysqld 真正可用，避免下一步连不上
          for i in $(seq 1 30); do
            if sudo mysqladmin ping --silent 2>/dev/null; then break; fi
            sleep 1
          done
          # 与应用默认口令对齐（本仓库的 application.yml 用 123456 作开发默认值）
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '123456';"
          sudo mysql -uroot -p123456 -e "CREATE DATABASE IF NOT EXISTS personal_ledger
            DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          sudo mysql -uroot -p123456 -e "SELECT VERSION();"

      - name: Build (runs JUnit unit tests via surefire)
        run: mvn -B -f backend/pom.xml clean package

      - name: Start the application
        run: |
          # 从仓库根启动，日志会落在 <repo>/logs（与本地一致）
          nohup java -Dfile.encoding=UTF-8 \
            -jar backend/target/personal-ledger-1.0.0-SNAPSHOT.jar \
            > app-console.log 2>&1 &
          echo $! > app.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::application did not become ready in 60s"
          tail -n 80 app-console.log || true
          exit 1

      # 五个脚本分别成 step，失败时能一眼看出是哪一套挂了
      - name: e2e - core ledger (test-api)
        run: pwsh -NoProfile -File backend/test-api.ps1

      - name: e2e - acceptance AC-03/04/05/07/13 (test-acceptance)
        run: pwsh -NoProfile -File backend/test-acceptance.ps1

      - name: e2e - budget AC-08/09 (test-budget)
        run: pwsh -NoProfile -File backend/test-budget.ps1

      - name: e2e - analysis AC-10/11 + export (test-analysis)
        run: pwsh -NoProfile -File backend/test-analysis.ps1

      - name: e2e - profile, query, security (test-profile-query)
        run: pwsh -NoProfile -File backend/test-profile-query.ps1

      - name: e2e - CSV export / import (test-import-export)
        run: pwsh -NoProfile -File backend/test-import-export.ps1

      - name: e2e - recurring rules (test-recurring)
        run: pwsh -NoProfile -File backend/test-recurring.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            app-console.log
            logs/
          if-no-files-found: ignore

      - name: Stop the application
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi
