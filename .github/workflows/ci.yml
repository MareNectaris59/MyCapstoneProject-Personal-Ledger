# =============================================================================
#  CI：构建 + 单元测试 + 端到端验收
#
#  为什么拆成两个 job：
#    115 项 JUnit 单元测试**不需要数据库**（全是纯逻辑），
#    却和需要 MySQL 的端到端测试绑在同一个 job 里 ——
#    结果是 MySQL 一挂，连"代码能不能编译、单元测试过不过"都看不出来。
#    现在 unit-tests 先跑，绿了才轮到 e2e，失败信息也更准。
#
#  为什么 CI 里不需要 Node：
#    前端构建产物（backend/src/main/resources/static/）已经入库，
#    mvn package 只是把它打进 jar。想验证前端源码能构建，
#    应当单独加一个 job，不属于当前这条链路。
#
#  首次运行失败过的记录（值得留档）：
#    第一版在 "Start MySQL and create the database" 一步退出码 1，
#    23 秒就挂，后面的步骤一步都没跑到。原因是直接用
#    ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password 改 root：
#      * ubuntu 镜像里 root@localhost 默认是 auth_socket 认证，
#        改掉之后 CI 自己后续的 sudo mysql 免密登录立刻失效；
#      * 且 mysql_native_password 在 MySQL 8.4 已被移除。
#    第二版改成"另建专用账号 ledger@%"（完全不碰 root），仍然在同一步失败 ——
#    说明真正的变量不是账号，而是 **runner 镜像里到底有没有 MySQL 服务**。
#    ubuntu-latest 会随镜像版本滚动，预装软件不可当作契约。
#    最终方案：用 Docker 服务容器（mysql:8.0），版本由我们自己钉死；
#    健康检查等到就绪后再往下走。
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. 构建 + 单元测试：不依赖数据库，应该永远是最快、最可信的一道门
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # package 会跑 surefire，也就是那 115 项单元测试
      - name: Build and run unit tests
        run: mvn -B -f backend/pom.xml clean package

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. 端到端：需要 MySQL + 运行中的应用
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (MySQL + 7 suites)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    # 用 Docker 服务容器，而不是依赖 runner 镜像里预装的 MySQL。
    #
    # 为什么要换（第二版 CI 的教训）：
    #   第一版改了 root 口令、把自己登录方式堵死，已修；
    #   第二版改成建专用账号，仍然在同一个步骤失败 —— 说明真正的
    #   不确定性不是账号，而是**runner 镜像里到底有没有 MySQL 服务**。
    #   ubuntu-latest 会随时间滚动到新版本镜像，预装软件是变动的；
    #   服务容器的版本由我们自己钉死，行为可预期。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pass
          MYSQL_DATABASE: personal_ledger
        # 映射到 3307 而不是 3306：万一 runner 镜像里恰好有 MySQL 占着 3306，
        # 端口绑定会直接失败。换个端口就与被预装了什么彻底无关。
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: personal_ledger
      DB_USERNAME: root
      DB_PASSWORD: 'ci_root_pass'
      APP_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 健康检查通常已经等到就绪；这一层是保险，且失败时能自己说话
      - name: Verify the database is reachable
        run: |
          set -x
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -pci_root_pass --silent 2>/dev/null; then
              echo "mysql is up after ${i}s"
              break
            fi
            sleep 2
          done
          if ! mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -pci_root_pass --silent 2>/dev/null; then
            echo "::error::MySQL service container is not reachable on 127.0.0.1:3307"
            docker ps -a || true
            docker logs $(docker ps -aq --filter 'name=mysql') 2>&1 | tail -60 || true
            exit 1
          fi
          # 用应用将要使用的那条路径自证一次
          mysql -h 127.0.0.1 -P 3307 -uroot -pci_root_pass \
            -e "SELECT VERSION() AS version;" personal_ledger

      - name: Build the jar (tests already ran in the first job)
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Start the application
        run: |
          nohup java -Dfile.encoding=UTF-8 \
            -jar backend/target/personal-ledger-1.0.0-SNAPSHOT.jar \
            > app-console.log 2>&1 &
          echo $! > app.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::application did not become ready in 90s"
          tail -n 120 app-console.log || true
          exit 1

      # 七个脚本分别成 step：哪一套挂了，一眼可见
      - name: e2e - core ledger
        run: pwsh -NoProfile -File backend/test-api.ps1

      - name: e2e - acceptance AC-03/04/05/07/13
        run: pwsh -NoProfile -File backend/test-acceptance.ps1

      - name: e2e - budget AC-08/09
        run: pwsh -NoProfile -File backend/test-budget.ps1

      - name: e2e - analysis AC-10/11 + export
        run: pwsh -NoProfile -File backend/test-analysis.ps1

      - name: e2e - profile, query, security
        run: pwsh -NoProfile -File backend/test-profile-query.ps1

      - name: e2e - CSV export / import
        run: pwsh -NoProfile -File backend/test-import-export.ps1

      - name: e2e - recurring rules
        run: pwsh -NoProfile -File backend/test-recurring.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            app-console.log
            logs/
          if-no-files-found: ignore

      - name: Stop the application
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; fi
